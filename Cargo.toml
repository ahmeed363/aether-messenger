[workspace]
members = [
    "crates/aether-core",
    "crates/aether-crypto",
    "crates/aether-mixnet",
    "crates/aether-chaff",
    "crates/aether-uniffi",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Aether Core Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
zeroize = { version = "1.7", features = ["derive", "zeroize_derive"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
tokio = { version = "1.36", features = ["full"] }
rand = "0.8"
rand_distr = "0.4" # لتوليد Poisson distribution لحزم الـ Chaff
thiserror = "1.0"
tracing = "0.1"
uniffi = "0.27"
